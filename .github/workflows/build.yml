name: Build Chainmail Flight mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the Fabric template for 1.21.11
        uses: actions/checkout@v4
        with:
          repository: FabricMC/fabric-example-mod
          ref: 1.21.11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Add the armor mod files
        run: |
          set -e
          # remove the template's example code
          rm -rf src/main/java src/client
          rm -f src/main/resources/*.mixins.json src/main/resources/fabric.mod.json
          # make sure the template uses Yarn names (the code below uses them)
          if grep -q officialMojangMappings build.gradle; then
            sed -i 's/loom.officialMojangMappings()/"net.fabricmc:yarn:${project.yarn_mappings}:v2"/' build.gradle
            echo 'yarn_mappings=1.21.11+build.4' >> gradle.properties
          fi
          mkdir -p src/main/java/com/example/chainmailflight
          cat > src/main/java/com/example/chainmailflight/ChainmailFlight.java <<'EOF_FILE'
          package com.example.chainmailflight;

          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.minecraft.entity.effect.StatusEffectInstance;
          import net.minecraft.entity.effect.StatusEffects;
          import net.minecraft.entity.player.PlayerAbilities;
          import net.minecraft.server.network.ServerPlayerEntity;

          public class ChainmailFlight implements ModInitializer {
              public static final String MOD_ID = "chainmailflight";

              @Override
              public void onInitialize() {
                  ModArmor.init();

                  ServerTickEvents.END_SERVER_TICK.register(server -> {
                      for (ServerPlayerEntity player : server.getPlayerManager().getPlayerList()) {
                          boolean wearing = ModArmor.isFullSet(player);
                          PlayerAbilities abilities = player.getAbilities();

                          if (wearing) {
                              player.addStatusEffect(new StatusEffectInstance(StatusEffects.NIGHT_VISION, 400, 0, true, false, false));
                              player.addStatusEffect(new StatusEffectInstance(StatusEffects.SPEED, 40, 2, true, false, false)); // Speed III

                              if (!abilities.allowFlying) {
                                  abilities.allowFlying = true;
                                  player.sendAbilitiesUpdate();
                              }
                          } else if (abilities.allowFlying && !player.isCreative() && !player.isSpectator()) {
                              abilities.allowFlying = false;
                              abilities.flying = false;
                              player.sendAbilitiesUpdate();
                          }
                      }
                  });
              }
          }
          EOF_FILE
          mkdir -p src/main/java/com/example/chainmailflight
          cat > src/main/java/com/example/chainmailflight/ModArmor.java <<'EOF_FILE'
          package com.example.chainmailflight;

          import net.fabricmc.fabric.api.itemgroup.v1.ItemGroupEvents;
          import net.minecraft.entity.EquipmentSlot;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.item.Item;
          import net.minecraft.item.ItemGroups;
          import net.minecraft.item.equipment.ArmorMaterial;
          import net.minecraft.item.equipment.EquipmentAsset;
          import net.minecraft.item.equipment.EquipmentAssetKeys;
          import net.minecraft.item.equipment.EquipmentType;
          import net.minecraft.registry.Registries;
          import net.minecraft.registry.Registry;
          import net.minecraft.registry.RegistryKey;
          import net.minecraft.registry.RegistryKeys;
          import net.minecraft.registry.tag.ItemTags;
          import net.minecraft.sound.SoundEvents;
          import net.minecraft.util.Identifier;

          import java.util.Map;

          public class ModArmor {
              public static final RegistryKey<EquipmentAsset> ASSET_KEY =
                  RegistryKey.of(EquipmentAssetKeys.REGISTRY_KEY, Identifier.of(ChainmailFlight.MOD_ID, "chainmail_flight"));

              // Same stats as netherite armor
              public static final ArmorMaterial MATERIAL = new ArmorMaterial(
                  37,
                  Map.of(
                      EquipmentType.HELMET, 3,
                      EquipmentType.CHESTPLATE, 8,
                      EquipmentType.LEGGINGS, 6,
                      EquipmentType.BOOTS, 3,
                      EquipmentType.BODY, 11
                  ),
                  15,
                  SoundEvents.ITEM_ARMOR_EQUIP_NETHERITE,
                  3.0F,
                  0.1F,
                  ItemTags.REPAIRS_NETHERITE_ARMOR,
                  ASSET_KEY
              );

              public static final Item HELMET     = register("chainmail_flight_helmet", EquipmentType.HELMET);
              public static final Item CHESTPLATE = register("chainmail_flight_chestplate", EquipmentType.CHESTPLATE);
              public static final Item LEGGINGS   = register("chainmail_flight_leggings", EquipmentType.LEGGINGS);
              public static final Item BOOTS      = register("chainmail_flight_boots", EquipmentType.BOOTS);

              private static Item register(String name, EquipmentType type) {
                  RegistryKey<Item> key = RegistryKey.of(RegistryKeys.ITEM, Identifier.of(ChainmailFlight.MOD_ID, name));
                  Item item = new Item(new Item.Settings().armor(MATERIAL, type).registryKey(key));
                  return Registry.register(Registries.ITEM, key, item);
              }

              public static boolean isFullSet(PlayerEntity p) {
                  return p.getEquippedStack(EquipmentSlot.HEAD).isOf(HELMET)
                      && p.getEquippedStack(EquipmentSlot.CHEST).isOf(CHESTPLATE)
                      && p.getEquippedStack(EquipmentSlot.LEGS).isOf(LEGGINGS)
                      && p.getEquippedStack(EquipmentSlot.FEET).isOf(BOOTS);
              }

              public static void init() {
                  ItemGroupEvents.modifyEntriesEvent(ItemGroups.COMBAT).register(e -> {
                      e.add(HELMET);
                      e.add(CHESTPLATE);
                      e.add(LEGGINGS);
                      e.add(BOOTS);
                  });
              }
          }
          EOF_FILE
          mkdir -p src/main/resources/assets/chainmailflight/equipment
          cat > src/main/resources/assets/chainmailflight/equipment/chainmail_flight.json <<'EOF_FILE'
          {
            "layers": {
              "humanoid": [{ "texture": "chainmailflight:chainmail_flight" }],
              "humanoid_leggings": [{ "texture": "chainmailflight:chainmail_flight" }]
            }
          }
          EOF_FILE
          mkdir -p src/main/resources/assets/chainmailflight/lang
          cat > src/main/resources/assets/chainmailflight/lang/en_us.json <<'EOF_FILE'
          {
            "item.chainmailflight.chainmail_flight_helmet": "Flight Chainmail Helmet",
            "item.chainmailflight.chainmail_flight_chestplate": "Flight Chainmail Chestplate",
            "item.chainmailflight.chainmail_flight_leggings": "Flight Chainmail Leggings",
            "item.chainmailflight.chainmail_flight_boots": "Flight Chainmail Boots"
          }
          EOF_FILE
          mkdir -p src/main/resources/assets/chainmailflight/items
          cat > src/main/resources/assets/chainmailflight/items/chainmail_flight_helmet.json <<'EOF_FILE'
          { "model": { "type": "minecraft:model", "model": "chainmailflight:item/chainmail_flight_helmet" } }
          EOF_FILE
          mkdir -p src/main/resources/assets/chainmailflight/models/item
          cat > src/main/resources/assets/chainmailflight/models/item/chainmail_flight_helmet.json <<'EOF_FILE'
          { "parent": "minecraft:item/generated", "textures": { "layer0": "chainmailflight:item/chainmail_flight_helmet" } }
          EOF_FILE
          mkdir -p src/main/resources/data/chainmailflight/recipe
          cat > src/main/resources/data/chainmailflight/recipe/chainmail_flight_helmet.json <<'EOF_FILE'
          {
            "type": "minecraft:crafting_shaped",
            "category": "equipment",
            "key": { "N": "minecraft:netherite_ingot", "S": "minecraft:nether_star" },
            "pattern": ["NNN", "NSN"],
            "result": { "id": "chainmailflight:chainmail_flight_helmet", "count": 1 }
          }
          EOF_FILE
          mkdir -p src/main/resources/assets/chainmailflight/items
          cat > src/main/resources/assets/chainmailflight/items/chainmail_flight_chestplate.json <<'EOF_FILE'
          { "model": { "type": "minecraft:model", "model": "chainmailflight:item/chainmail_flight_chestplate" } }
          EOF_FILE
          mkdir -p src/main/resources/assets/chainmailflight/models/item
          cat > src/main/resources/assets/chainmailflight/models/item/chainmail_flight_chestplate.json <<'EOF_FILE'
          { "parent": "minecraft:item/generated", "textures": { "layer0": "chainmailflight:item/chainmail_flight_chestplate" } }
          EOF_FILE
          mkdir -p src/main/resources/data/chainmailflight/recipe
          cat > src/main/resources/data/chainmailflight/recipe/chainmail_flight_chestplate.json <<'EOF_FILE'
          {
            "type": "minecraft:crafting_shaped",
            "category": "equipment",
            "key": { "N": "minecraft:netherite_ingot", "S": "minecraft:nether_star" },
            "pattern": ["NSN", "NNN", "NNN"],
            "result": { "id": "chainmailflight:chainmail_flight_chestplate", "count": 1 }
          }
          EOF_FILE
          mkdir -p src/main/resources/assets/chainmailflight/items
          cat > src/main/resources/assets/chainmailflight/items/chainmail_flight_leggings.json <<'EOF_FILE'
          { "model": { "type": "minecraft:model", "model": "chainmailflight:item/chainmail_flight_leggings" } }
          EOF_FILE
          mkdir -p src/main/resources/assets/chainmailflight/models/item
          cat > src/main/resources/assets/chainmailflight/models/item/chainmail_flight_leggings.json <<'EOF_FILE'
          { "parent": "minecraft:item/generated", "textures": { "layer0": "chainmailflight:item/chainmail_flight_leggings" } }
          EOF_FILE
          mkdir -p src/main/resources/data/chainmailflight/recipe
          cat > src/main/resources/data/chainmailflight/recipe/chainmail_flight_leggings.json <<'EOF_FILE'
          {
            "type": "minecraft:crafting_shaped",
            "category": "equipment",
            "key": { "N": "minecraft:netherite_ingot", "S": "minecraft:nether_star" },
            "pattern": ["NNN", "NSN", "N N"],
            "result": { "id": "chainmailflight:chainmail_flight_leggings", "count": 1 }
          }
          EOF_FILE
          mkdir -p src/main/resources/assets/chainmailflight/items
          cat > src/main/resources/assets/chainmailflight/items/chainmail_flight_boots.json <<'EOF_FILE'
          { "model": { "type": "minecraft:model", "model": "chainmailflight:item/chainmail_flight_boots" } }
          EOF_FILE
          mkdir -p src/main/resources/assets/chainmailflight/models/item
          cat > src/main/resources/assets/chainmailflight/models/item/chainmail_flight_boots.json <<'EOF_FILE'
          { "parent": "minecraft:item/generated", "textures": { "layer0": "chainmailflight:item/chainmail_flight_boots" } }
          EOF_FILE
          mkdir -p src/main/resources/data/chainmailflight/recipe
          cat > src/main/resources/data/chainmailflight/recipe/chainmail_flight_boots.json <<'EOF_FILE'
          {
            "type": "minecraft:crafting_shaped",
            "category": "equipment",
            "key": { "N": "minecraft:netherite_ingot", "S": "minecraft:nether_star" },
            "pattern": ["NSN", "N N"],
            "result": { "id": "chainmailflight:chainmail_flight_boots", "count": 1 }
          }
          EOF_FILE
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'EOF_FILE'
          {
            "schemaVersion": 1,
            "id": "chainmailflight",
            "version": "${version}",
            "name": "Chainmail Flight",
            "description": "Chainmail-looking armor with netherite protection, night vision, Speed III and flight.",
            "authors": ["You"],
            "license": "CC0-1.0",
            "environment": "*",
            "entrypoints": { "main": ["com.example.chainmailflight.ChainmailFlight"] },
            "depends": { "fabricloader": ">=0.16.0", "minecraft": "~1.21.11", "java": ">=21", "fabric-api": "*" }
          }
          EOF_FILE
          # make the chainmail textures
          python3 -m pip install --break-system-packages pillow || true
          mkdir -p src/main/resources/assets/chainmailflight/textures/item src/main/resources/assets/chainmailflight/textures/entity/equipment/humanoid src/main/resources/assets/chainmailflight/textures/entity/equipment/humanoid_leggings
          python3 - <<'EOF_PY'
          from PIL import Image
          base='src/main/resources/assets/chainmailflight/textures/'
          def chain(x,y):
              light=(176,196,206); dark=(88,108,124); mid=(128,150,164)
              if x%4==2 and y%4==2: return light
              if ((x+y)%4==0) or ((x-y)%4==0): return mid if (x+y)%8 else light
              return dark
          for name in ['humanoid','humanoid_leggings']:
              im=Image.new('RGBA',(64,32)); px=im.load()
              for y in range(32):
                  for x in range(64): px[x,y]=chain(x,y)+(255,)
              im.save(base+'entity/equipment/'+name+'/chainmail_flight.png')
          masks={
          'helmet':["................","................","....########....","...##########...","..############..","..############..","..###......###..","..###......###..","..###......###..","..##........##..","................","................","................","................","................","................"],
          'chestplate':["................","..####....####..",".#####....#####.",".##############.",".##############.","..############..","..############..","..############..","..############..","..############..","..############..","..############..","................","................","................","................"],
          'leggings':["................","..############..","..############..","..############..","..############..","..#####..#####..","..#####..#####..","..#####..#####..","..#####..#####..","..#####..#####..","..#####..#####..","..#####..#####..","................","................","................","................"],
          'boots':["................","................","................","................","................","................","..####....####..","..####....####..","..####....####..","..####....####..",".#####....#####.",".#####....#####.",".#####....#####.","................","................","................"],
          }
          for n,m in masks.items():
              im=Image.new('RGBA',(16,16)); px=im.load()
              solid=lambda x,y: 0<=x<16 and 0<=y<16 and m[y][x]=='#'
              for y in range(16):
                  for x in range(16):
                      if solid(x,y):
                          edge=not all(solid(x+dx,y+dy) for dx,dy in((1,0),(-1,0),(0,1),(0,-1)))
                          px[x,y]=(60,78,92,255) if edge else chain(x,y)+(255,)
              im.save(base+'item/chainmail_flight_'+n+'.png')
          EOF_PY
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: chainmail-flight-mod
          path: build/libs/*.jar
